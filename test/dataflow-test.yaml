$schema: https://schemas.meshmakers.cloud/runtime-model.schema.json
# ---------------------------------------------------------------------------
# Scratch dataflow for FamilyOS API pipeline iteration.
#
# Mirrors what the blueprint seed will install, but with scratch rtIds in the
# 0fa9… range so the final blueprint install (0fa0… range) stays clean.
# The domain seed entities (household singleton + calendar categories) use
# their FINAL 0fa0… rtIds — the blueprint upserts the same values later.
#
# Import:   octo-cli -c ImportRt -f test/dataflow-test.yaml -w   (-r on re-runs)
# Deploy:   octo-cli -c DeployDataFlow --identifier 0fa900000000000000000001
# Test:     kubectl port-forward -n octo svc/familyos-670000000000000000000002 5020:80
#           curl http://localhost:5020/familyos/<path>
# ---------------------------------------------------------------------------
dependencies:
- System.Communication-[4.5,5.0)
- FamilyOs-[1.0.0,2.0.0)
entities:

  # ========================================================================
  # Domain seeds — household singleton + default calendar categories
  # (final rtIds, identical to the blueprint seed)
  # ========================================================================
  - rtId: '0fa000000000000000000030'
    ckTypeId: FamilyOs/Household-1
    attributes:
      - id: FamilyOs/HouseholdMamaName-1
        value: "Mama"
      - id: FamilyOs/HouseholdPapaName-1
        value: "Papa"
      - id: FamilyOs/HouseholdMamaScore-1
        value: 0
      - id: FamilyOs/HouseholdPapaScore-1
        value: 0
      - id: FamilyOs/HouseholdEarnedStickers-1
        value: []

  - rtId: '0fa000000000000000000031'
    ckTypeId: FamilyOs/CalendarCategory-1
    attributes:
      - id: FamilyOs/CategoryName-1
        value: "KiGa Bringen"
      - id: FamilyOs/CategoryIcon-1
        value: "bike"

  - rtId: '0fa000000000000000000032'
    ckTypeId: FamilyOs/CalendarCategory-1
    attributes:
      - id: FamilyOs/CategoryName-1
        value: "KiGa Abholen"
      - id: FamilyOs/CategoryIcon-1
        value: "bike"

  - rtId: '0fa000000000000000000033'
    ckTypeId: FamilyOs/CalendarCategory-1
    attributes:
      - id: FamilyOs/CategoryName-1
        value: "Schule Abholen"
      - id: FamilyOs/CategoryIcon-1
        value: "bag"

  # ========================================================================
  # Scratch DataFlow
  # ========================================================================
  - rtId: '0fa900000000000000000001'
    ckTypeId: System.Communication/DataFlow-1
    attributes:
      - id: System/Name-1
        value: "FamilyOS API (scratch)"
      - id: System/Description-1
        value: "Scratch dataflow for FamilyOS HTTP API pipeline iteration."

  # ========================================================================
  # Probe (scratch only, never ships): Math semantics + raw entity shapes
  # ========================================================================
  - rtId: '0fa9000000000000000000f0'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-probe"
      - id: System/Description-1
        value: "POST /probe — scratch probe for Math semantics and raw entity shapes"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: probe
              method: Post
              path: /probe

          transformations:
            - type: SetPrimitiveValue@1
              valuePath: $.body.a
              valueType: Int
              targetPath: $.calc.a

            - type: Math@1
              description: sum = a + b
              path: $.calc
              itemPath: $.a
              operation: Add
              valuePath: $.body.b
              itemTargetPath: $.sum

            - type: Math@1
              description: rem = a mod 2
              path: $.calc
              itemPath: $.a
              operation: Modulo
              value: 2
              itemTargetPath: $.rem

            - type: GetRtEntitiesByType@1
              description: raw task entities to inspect enum serialization
              ckTypeId: FamilyOs/Task
              take: 5
              targetPath: $.tasksRaw

            - type: GetRtEntitiesByType@1
              description: field-filter variant test — PascalCase attribute name, constant
              ckTypeId: FamilyOs/ShoppingItem
              targetPath: $.f1
              fieldFilters:
                - attributePath: Done
                  operator: Equals
                  comparisonValue: true
            - type: GetRtEntitiesByType@1
              description: field-filter variant test — camelCase attribute name, constant
              ckTypeId: FamilyOs/ShoppingItem
              targetPath: $.f2
              fieldFilters:
                - attributePath: done
                  operator: Equals
                  comparisonValue: true
            - type: SetPrimitiveValue@1
              valuePath: $.f1.TotalCount
              valueType: Int
              targetPath: $.calc.filterPascal
            - type: SetPrimitiveValue@1
              valuePath: $.f2.TotalCount
              valueType: Int
              targetPath: $.calc.filterCamel

            - type: Project@1
              clear: true
              fields:
                - path: $.calc
                  inclusion: true
                - path: $.tasksRaw
                  inclusion: true

  # ========================================================================
  # GET /state — full application state for the client boot
  # ========================================================================
  - rtId: '0fa900000000000000000002'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-get-state"
      - id: System/Description-1
        value: "GET /state — aggregated application state (household, cats, tasks, shopping, notes, days)"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP GET /state
              method: Get
              path: /state

          transformations:
            - type: GetRtEntitiesByType@1
              description: Household singleton
              ckTypeId: FamilyOs/Household
              take: 1
              targetPath: $.hh

            - type: SetPrimitiveValue@1
              valuePath: $.hh.Items[0].Attributes.MamaName
              valueType: String
              targetPath: $.household.mamaName
            - type: SetPrimitiveValue@1
              valuePath: $.hh.Items[0].Attributes.PapaName
              valueType: String
              targetPath: $.household.papaName
            - type: SetPrimitiveValue@1
              valuePath: $.hh.Items[0].Attributes.MamaScore
              valueType: Int
              targetPath: $.household.mamaScore
            - type: SetPrimitiveValue@1
              valuePath: $.hh.Items[0].Attributes.PapaScore
              valueType: Int
              targetPath: $.household.papaScore
            - type: SetPrimitiveValue@1
              valuePath: $.hh.Items[0].Attributes.EarnedStickers
              valueType: StringArray
              targetPath: $.household.earned

            - type: GetRtEntitiesByType@1
              description: Calendar categories
              ckTypeId: FamilyOs/CalendarCategory
              take: 50
              targetPath: $.catsL
            - type: ForEach@1
              iterationPath: $.catsL.Items
              keyPath: $.key
              mergePath: $.key.out
              targetPath: $.cats
              transformations:
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key.out.id
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Name
                  valueType: String
                  targetPath: $.key.out.name
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Icon
                  valueType: String
                  targetPath: $.key.out.icon

            - type: GetRtEntitiesByType@1
              description: Tasks
              ckTypeId: FamilyOs/Task
              take: 500
              targetPath: $.tasksL
            - type: ForEach@1
              iterationPath: $.tasksL.Items
              keyPath: $.key
              mergePath: $.key.out
              targetPath: $.tasks
              transformations:
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key.out.id
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Title
                  valueType: String
                  targetPath: $.key.out.title
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.AssignedTo
                  valueType: Int
                  targetPath: $.key.out.person
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Done
                  valueType: Boolean
                  targetPath: $.key.out.done
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Kind
                  valueType: Int
                  targetPath: $.key.out.type
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Points
                  valueType: Int
                  targetPath: $.key.out.pts
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.DueDate
                  valueType: String
                  targetPath: $.key.out.date
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.RecurDays
                  valueType: Int
                  targetPath: $.key.out.recurDays
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.CompletedBy
                  valueType: String
                  targetPath: $.key.out.completedBy
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Icon
                  valueType: String
                  targetPath: $.key.out.icon
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.LastCompleted
                  valueType: String
                  targetPath: $.key.out.lastCompleted

            - type: GetRtEntitiesByType@1
              description: Shopping items
              ckTypeId: FamilyOs/ShoppingItem
              take: 500
              targetPath: $.shopL
            - type: ForEach@1
              iterationPath: $.shopL.Items
              keyPath: $.key
              mergePath: $.key.out
              targetPath: $.shopping
              transformations:
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key.out.id
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Name
                  valueType: String
                  targetPath: $.key.out.name
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Category
                  valueType: Int
                  targetPath: $.key.out.cat
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Done
                  valueType: Boolean
                  targetPath: $.key.out.done

            - type: GetRtEntitiesByType@1
              description: Pinboard notes
              ckTypeId: FamilyOs/Note
              take: 200
              targetPath: $.notesL
            - type: ForEach@1
              iterationPath: $.notesL.Items
              keyPath: $.key
              mergePath: $.key.out
              targetPath: $.notes
              transformations:
                - type: SetPrimitiveValue@1
                  valuePath: $.key.RtId
                  valueType: String
                  targetPath: $.key.out.id
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Text
                  valueType: String
                  targetPath: $.key.out.text
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.AssignedTo
                  valueType: Int
                  targetPath: $.key.out.person

            - type: GetRtEntitiesByType@1
              description: Day assignments
              ckTypeId: FamilyOs/DayEntry
              take: 2000
              targetPath: $.daysL
            - type: ForEach@1
              iterationPath: $.daysL.Items
              keyPath: $.key
              mergePath: $.key.out
              targetPath: $.days
              transformations:
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.DateKey
                  valueType: String
                  targetPath: $.key.out.dateKey
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.CategoryRtId
                  valueType: String
                  targetPath: $.key.out.categoryId
                - type: SetPrimitiveValue@1
                  valuePath: $.key.Attributes.Assignment
                  valueType: Int
                  targetPath: $.key.out.assignment

            - type: Project@1
              description: Response = the aggregated state only
              clear: true
              fields:
                - path: $.household
                  inclusion: true
                - path: $.cats
                  inclusion: true
                - path: $.tasks
                  inclusion: true
                - path: $.shopping
                  inclusion: true
                - path: $.notes
                  inclusion: true
                - path: $.days
                  inclusion: true

  # ========================================================================
  # POST /tasks — create a task. Body always carries ALL fields
  # (unused ones as "" / 0) so no attribute is ever unset.
  # ========================================================================
  - rtId: '0fa900000000000000000003'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-create-task"
      - id: System/Description-1
        value: "POST /tasks — create a task. Body: { title, person, type, pts, date, recurDays, icon } (person/type as enum names)"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP POST /tasks
              method: Post
              path: /tasks

          transformations:
            - type: CreateUpdateInfo@1
              description: Insert the new task
              updateKind: Insert
              ckTypeId: FamilyOs/Task
              rtIdPath: $.newRtId
              generateRtId: true
              targetPath: $.updates
              targetValueWriteMode: Append
              targetValueKind: Array
              attributeUpdates:
                - attributeName: Title
                  attributeValueType: String
                  valuePath: $.body.title
                - attributeName: AssignedTo
                  attributeValueType: Enum
                  valuePath: $.body.person
                - attributeName: Done
                  attributeValueType: Boolean
                  value: false
                - attributeName: Kind
                  attributeValueType: Enum
                  valuePath: $.body.type
                - attributeName: Points
                  attributeValueType: Int
                  valuePath: $.body.pts
                - attributeName: DueDate
                  attributeValueType: String
                  valuePath: $.body.date
                - attributeName: RecurDays
                  attributeValueType: Int
                  valuePath: $.body.recurDays
                - attributeName: CompletedBy
                  attributeValueType: String
                  value: ""
                - attributeName: Icon
                  attributeValueType: String
                  valuePath: $.body.icon
                - attributeName: LastCompleted
                  attributeValueType: String
                  value: ""

            - type: ApplyChanges@2
              entityUpdatesPath: $.updates

            - type: SetPrimitiveValue@1
              valuePath: $.updates[0].RtId
              valueType: String
              targetPath: $.id

            - type: Project@1
              clear: true
              fields:
                - path: $.id
                  inclusion: true

  # ========================================================================
  # POST /tasks/toggle — flip done state, book points server-side.
  # Body: { id, completedBy, today } — completedBy is "Mama"|"Papa"|"",
  # today is the client's local YYYY-MM-DD day key.
  # Response: { done, mamaScore, papaScore } or { error }
  # ========================================================================
  - rtId: '0fa900000000000000000004'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-toggle-task"
      - id: System/Description-1
        value: "POST /tasks/toggle — toggle a task and book points on the household (server-side scoring)"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP POST /tasks/toggle
              method: Post
              path: /tasks/toggle

          transformations:
            - type: GetRtEntitiesByType@1
              description: Look up the task
              ckTypeId: FamilyOs/Task
              targetPath: $.lookup
              fieldFilters:
                - attributePath: RtId
                  operator: Equals
                  comparisonValuePath: $.body.id

            - type: If@1
              description: Unknown task id
              path: $.lookup.TotalCount
              operator: Equal
              value: 0
              valueType: Int
              transformations:
                - type: SetPrimitiveValue@1
                  value: not_found
                  valueType: String
                  targetPath: $.error

            - type: If@1
              description: Task exists — toggle and score
              path: $.lookup.TotalCount
              operator: GreaterThan
              value: 0
              valueType: Int
              transformations:
                # ---- snapshots ----
                - type: SetPrimitiveValue@1
                  valuePath: $.lookup.Items[0].Attributes.Done
                  valueType: Boolean
                  targetPath: $.wasDone
                - type: SetPrimitiveValue@1
                  valuePath: $.lookup.Items[0].Attributes.Points
                  valueType: Int
                  targetPath: $.calc.pts
                - type: SetPrimitiveValue@1
                  description: Enum attributes read back as integer keys (Mama=0, Papa=1, Both=2)
                  valuePath: $.lookup.Items[0].Attributes.AssignedTo
                  valueType: Int
                  targetPath: $.assignedTo
                - type: SetPrimitiveValue@1
                  valuePath: $.lookup.Items[0].Attributes.CompletedBy
                  valueType: String
                  targetPath: $.oldCompletedBy

                - type: GetRtEntitiesByType@1
                  description: Household for score booking
                  ckTypeId: FamilyOs/Household
                  take: 1
                  targetPath: $.hh
                - type: SetPrimitiveValue@1
                  valuePath: $.hh.Items[0].Attributes.MamaScore
                  valueType: Int
                  targetPath: $.calc.mama
                - type: SetPrimitiveValue@1
                  valuePath: $.hh.Items[0].Attributes.PapaScore
                  valueType: Int
                  targetPath: $.calc.papa

                # ---- completing: delta = +pts, scorer from request ----
                - type: If@1
                  path: $.wasDone
                  operator: Equal
                  value: false
                  valueType: Boolean
                  transformations:
                    - type: SetPrimitiveValue@1
                      valuePath: $.calc.pts
                      valueType: Int
                      targetPath: $.calc.delta
                    - type: SetPrimitiveValue@1
                      valuePath: $.body.completedBy
                      valueType: String
                      targetPath: $.scorer
                    - type: SetPrimitiveValue@1
                      value: true
                      valueType: Boolean
                      targetPath: $.done
                    - type: CreateUpdateInfo@1
                      description: Mark done, remember who did it and when
                      updateKind: Update
                      ckTypeId: FamilyOs/Task
                      rtIdPath: $.lookup.Items[0].RtId
                      targetPath: $.updates
                      targetValueWriteMode: Append
                      targetValueKind: Array
                      attributeUpdates:
                        - attributeName: Done
                          attributeValueType: Boolean
                          value: true
                        - attributeName: CompletedBy
                          attributeValueType: String
                          valuePath: $.body.completedBy
                        - attributeName: LastCompleted
                          attributeValueType: String
                          valuePath: $.body.today

                # ---- un-completing: delta = -pts, scorer from stored CompletedBy ----
                - type: If@1
                  path: $.wasDone
                  operator: Equal
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: Math@1
                      description: delta = pts * -1
                      path: $.calc
                      itemPath: $.pts
                      operation: Multiply
                      value: -1
                      itemTargetPath: $.delta
                    - type: SetPrimitiveValue@1
                      valuePath: $.oldCompletedBy
                      valueType: String
                      targetPath: $.scorer
                    - type: SetPrimitiveValue@1
                      value: false
                      valueType: Boolean
                      targetPath: $.done
                    - type: CreateUpdateInfo@1
                      description: Mark un-done and clear the completer
                      updateKind: Update
                      ckTypeId: FamilyOs/Task
                      rtIdPath: $.lookup.Items[0].RtId
                      targetPath: $.updates
                      targetValueWriteMode: Append
                      targetValueKind: Array
                      attributeUpdates:
                        - attributeName: Done
                          attributeValueType: Boolean
                          value: false
                        - attributeName: CompletedBy
                          attributeValueType: String
                          value: ""

                # ---- non-Both tasks always score for their assignee (enum keys) ----
                - type: If@1
                  path: $.assignedTo
                  operator: Equal
                  value: 0
                  valueType: Int
                  transformations:
                    - type: SetPrimitiveValue@1
                      value: Mama
                      valueType: String
                      targetPath: $.scorer
                - type: If@1
                  path: $.assignedTo
                  operator: Equal
                  value: 1
                  valueType: Int
                  transformations:
                    - type: SetPrimitiveValue@1
                      value: Papa
                      valueType: String
                      targetPath: $.scorer

                # ---- book the delta ----
                - type: If@1
                  description: Only score point-carrying tasks
                  path: $.calc.pts
                  operator: GreaterThan
                  value: 0
                  valueType: Int
                  transformations:
                    - type: If@1
                      path: $.scorer
                      operator: Equal
                      value: Mama
                      valueType: String
                      transformations:
                        - type: Math@1
                          path: $.calc
                          itemPath: $.mama
                          operation: Add
                          valuePath: $.calc.delta
                          itemTargetPath: $.mama
                    - type: If@1
                      path: $.scorer
                      operator: Equal
                      value: Papa
                      valueType: String
                      transformations:
                        - type: Math@1
                          path: $.calc
                          itemPath: $.papa
                          operation: Add
                          valuePath: $.calc.delta
                          itemTargetPath: $.papa
                    - type: If@1
                      description: Nobody specific (Both without completer) — split the delta
                      path: $.scorer
                      operator: Equal
                      value: ""
                      valueType: String
                      transformations:
                        - type: Math@1
                          description: rem = delta mod 2
                          path: $.calc
                          itemPath: $.delta
                          operation: Modulo
                          value: 2
                          itemTargetPath: $.rem
                        - type: Math@1
                          description: even = delta - rem
                          path: $.calc
                          itemPath: $.delta
                          operation: Subtract
                          valuePath: $.calc.rem
                          itemTargetPath: $.even
                        - type: Math@1
                          description: half = even / 2
                          path: $.calc
                          itemPath: $.even
                          operation: Divide
                          value: 2
                          itemTargetPath: $.half
                        - type: Math@1
                          path: $.calc
                          itemPath: $.mama
                          operation: Add
                          valuePath: $.calc.half
                          itemTargetPath: $.mama
                        - type: Math@1
                          path: $.calc
                          itemPath: $.papa
                          operation: Add
                          valuePath: $.calc.half
                          itemTargetPath: $.papa

                # ---- clamp at 0 like the app does ----
                - type: If@1
                  path: $.calc.mama
                  operator: LessThan
                  value: 0
                  valueType: Int
                  transformations:
                    - type: SetPrimitiveValue@1
                      value: 0
                      valueType: Int
                      targetPath: $.calc.mama
                - type: If@1
                  path: $.calc.papa
                  operator: LessThan
                  value: 0
                  valueType: Int
                  transformations:
                    - type: SetPrimitiveValue@1
                      value: 0
                      valueType: Int
                      targetPath: $.calc.papa

                # ---- persist household scores + task toggle in one batch ----
                - type: CreateUpdateInfo@1
                  description: Book the new scores
                  updateKind: Update
                  ckTypeId: FamilyOs/Household
                  rtIdPath: $.hh.Items[0].RtId
                  targetPath: $.updates
                  targetValueWriteMode: Append
                  targetValueKind: Array
                  attributeUpdates:
                    - attributeName: MamaScore
                      attributeValueType: Int
                      valuePath: $.calc.mama
                    - attributeName: PapaScore
                      attributeValueType: Int
                      valuePath: $.calc.papa

                - type: ApplyChanges@2
                  entityUpdatesPath: $.updates

                - type: SetPrimitiveValue@1
                  valuePath: $.calc.mama
                  valueType: Int
                  targetPath: $.mamaScore
                - type: SetPrimitiveValue@1
                  valuePath: $.calc.papa
                  valueType: Int
                  targetPath: $.papaScore

            - type: Project@1
              clear: true
              fields:
                - path: $.done
                  inclusion: true
                - path: $.mamaScore
                  inclusion: true
                - path: $.papaScore
                  inclusion: true
                - path: $.error
                  inclusion: true

  # ========================================================================
  # DELETE /tasks?id= — delete a task
  # ========================================================================
  - rtId: '0fa900000000000000000005'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-delete-task"
      - id: System/Description-1
        value: "DELETE /tasks?id= — delete a task"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP DELETE /tasks?id=
              method: Delete
              path: /tasks

          transformations:
            - type: CreateUpdateInfo@1
              updateKind: Delete
              ckTypeId: FamilyOs/Task
              rtIdPath: $.query.id
              targetPath: $.updates
              targetValueWriteMode: Append
