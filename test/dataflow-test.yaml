  # ========================================================================
  # POST /shopping/toggle — flip an item's done state
  # ========================================================================
  - rtId: '0fa900000000000000000008'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-toggle-shopitem"
      - id: System/Description-1
        value: "POST /shopping/toggle — flip the done state of a shopping item. Body: { id }"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP POST /shopping/toggle
              method: Post
              path: /shopping/toggle

          transformations:
            - type: GetRtEntitiesByType@1
              ckTypeId: FamilyOs/ShoppingItem
              targetPath: $.lookup
              fieldFilters:
                - attributePath: RtId
                  operator: Equals
                  comparisonValuePath: $.body.id

            - type: If@1
              path: $.lookup.TotalCount
              operator: Equal
              value: 0
              valueType: Int
              transformations:
                - type: SetPrimitiveValue@1
                  value: not_found
                  valueType: String
                  targetPath: $.error

            - type: If@1
              path: $.lookup.TotalCount
              operator: GreaterThan
              value: 0
              valueType: Int
              transformations:
                - type: If@1
                  path: $.lookup.Items[0].Attributes.Done
                  operator: Equal
                  value: false
                  valueType: Boolean
                  transformations:
                    - type: SetPrimitiveValue@1
                      value: true
                      valueType: Boolean
                      targetPath: $.done
                - type: If@1
                  path: $.lookup.Items[0].Attributes.Done
                  operator: Equal
                  value: true
                  valueType: Boolean
                  transformations:
                    - type: SetPrimitiveValue@1
                      value: false
                      valueType: Boolean
                      targetPath: $.done

                - type: CreateUpdateInfo@1
                  updateKind: Update
                  ckTypeId: FamilyOs/ShoppingItem
                  rtIdPath: $.lookup.Items[0].RtId
                  targetPath: $.updates
                  targetValueWriteMode: Append
                  targetValueKind: Array
                  attributeUpdates:
                    - attributeName: Done
                      attributeValueType: Boolean
                      valuePath: $.done

                - type: ApplyChanges@2
                  entityUpdatesPath: $.updates

            - type: Project@1
              clear: true
              fields:
                - path: $.done
                  inclusion: true
                - path: $.error
                  inclusion: true

