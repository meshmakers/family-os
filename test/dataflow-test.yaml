  # ========================================================================
  # POST /household/stickers — persist the earned sticker set
  # ========================================================================
  - rtId: '0fa90000000000000000000f'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-update-stickers"
      - id: System/Description-1
        value: "POST /household/stickers — replace the earned sticker ids. Body: { earned: [id, ...], count: n }. count=0 stores the sentinel [\"~\"] because the pipeline layer cannot write an empty array (it would become null); readers filter the sentinel."
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP POST /household/stickers
              method: Post
              path: /household/stickers

          transformations:
            - type: GetRtEntitiesByType@1
              ckTypeId: FamilyOs/Household
              take: 1
              targetPath: $.hh

            - type: If@1
              description: Non-empty set — store as sent
              path: $.body.count
              operator: GreaterThan
              value: 0
              valueType: Int
              transformations:
                - type: CreateUpdateInfo@1
                  updateKind: Update
                  ckTypeId: FamilyOs/Household
                  rtIdPath: $.hh.Items[0].RtId
                  targetPath: $.updates
                  targetValueWriteMode: Append
                  targetValueKind: Array
                  attributeUpdates:
                    - attributeName: EarnedStickers
                      attributeValueType: StringArray
                      valuePath: $.body.earned

            - type: If@1
              description: Empty set — store the sentinel (writing [] would null the attribute)
              path: $.body.count
              operator: Equal
              value: 0
              valueType: Int
              transformations:
                - type: CreateUpdateInfo@1
                  updateKind: Update
                  ckTypeId: FamilyOs/Household
                  rtIdPath: $.hh.Items[0].RtId
                  targetPath: $.updates
                  targetValueWriteMode: Append
                  targetValueKind: Array
                  attributeUpdates:
                    - attributeName: EarnedStickers
                      attributeValueType: StringArray
                      value: ["~"]

            - type: ApplyChanges@2
              entityUpdatesPath: $.updates

            - type: SetPrimitiveValue@1
              value: true
              valueType: Boolean
              targetPath: $.ok

            - type: Project@1
              clear: true
              fields:
                - path: $.ok
                  inclusion: true

