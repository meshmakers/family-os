  # ========================================================================
  # POST /shopping/clear-done — remove all done items
  # ========================================================================
  - rtId: '0fa90000000000000000000a'
    ckTypeId: System.Communication/Pipeline-1
    associations:
      - roleId: System/ParentChild-1
        targetRtId: '0fa900000000000000000001'
        targetCkTypeId: System.Communication/DataFlow-1
      - roleId: System.Communication/Executes-1
        targetRtId: '670000000000000000000002'
        targetCkTypeId: System.Communication/Adapter-1
    attributes:
      - id: System/Name-1
        value: "fam-clear-done-shopping"
      - id: System/Description-1
        value: "POST /shopping/clear-done — delete every shopping item already marked done"
      - id: System/Enabled-1
        value: true
      - id: System.Communication/DeploymentState-1
        value: 0
      - id: System.Communication/PipelineDefinition-1
        value: |
          triggers:
            - type: FromHttpRequest@1
              description: HTTP POST /shopping/clear-done
              method: Post
              path: /shopping/clear-done

          transformations:
            - type: GetRtEntitiesByType@1
              description: All done items (fieldFilter on the attribute works with constants)
              ckTypeId: FamilyOs/ShoppingItem
              take: 500
              targetPath: $.lookup
              fieldFilters:
                - attributePath: Done
                  operator: Equals
                  comparisonValue: true

            - type: ForEach@1
              description: One delete per done item — child $.del subtrees collect into $.dels
              iterationPath: $.lookup.Items
              keyPath: $.key
              mergePath: $.del
              targetPath: $.dels
              transformations:
                - type: CreateUpdateInfo@1
                  updateKind: Delete
                  ckTypeId: FamilyOs/ShoppingItem
                  rtIdPath: $.key.RtId
                  targetPath: $.del
                  attributeUpdates: []

            - type: If@1
              description: Apply only when something matched
              path: $.lookup.TotalCount
              operator: GreaterThan
              value: 0
              valueType: Int
              transformations:
                - type: ApplyChanges@2
                  entityUpdatesPath: $.dels

            - type: SetPrimitiveValue@1
              value: true
              valueType: Boolean
              targetPath: $.ok

            - type: Project@1
              clear: true
              fields:
                - path: $.ok
                  inclusion: true

